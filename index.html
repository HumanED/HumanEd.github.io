<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- This appears as the title in search results -->
    <title>HumanEd</title>
    
    <!-- This appears as the description in search results -->
    <meta name="description" content="The University of Edinburgh's Humanoid Robotics Society">
    
    <!-- Favicon - appears in browser tab and search results -->
    <link rel="icon" type="image/png" href="logo-blackbg.png">
    <link rel="shortcut icon" type="image/png" href="logo-blackbg.png">
    
    <!-- Apple touch icon for mobile -->
    <link rel="apple-touch-icon" href="logo-blackbg.png">
    
    <!-- Optional: Open Graph image for social media and sometimes search -->
    <meta property="og:image" content="https://humaned.github.io/logo-blackbg.png">
    <meta property="og:title" content="HumanEd">
    <meta property="og:description" content="The University of Edinburgh's Humanoid Robotics Society">
    
    <!-- Optional: tells search engines where the real site is now -->
    <link rel="canonical" href="https://humaned.eusa.ed.ac.uk/">
    
    <!-- Redirect code -->
    <meta http-equiv="refresh" content="0; url=https://humaned.eusa.ed.ac.uk/">
    <script type="text/javascript">
        window.location.href = "https://humaned.eusa.ed.ac.uk/"
    </script>
</head>
<body>
    <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
        <h1>The HumanEd website has moved!</h1>
        <p>You will be redirected to our new website automatically.</p>
        <p>If not, please <a href="https://humaned.eusa.ed.ac.uk/">click here</a>.</p>
    </div>
</body>
</html>
