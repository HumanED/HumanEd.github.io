<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- This appears as the title in search results -->
    <title>HumanEd</title>
    
    <!-- This appears as the description in search results -->
    <meta name="description" content="The University of Edinburgh's Humanoid Robotics Society">
    
    <!-- Optional: tells search engines where the real site is now -->
    <link rel="canonical" href="https://humaned.framer.website/">
    
    <!-- Redirect code -->
    <meta http-equiv="refresh" content="0; url=https://humaned.framer.website/">
    <script type="text/javascript">
        window.location.href = "https://humaned.framer.website/"
    </script>
</head>
<body>
    <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
        <h1>The HumanEd website has moved!</h1>
        <p>You will be redirected to our new website automatically.</p>
        <p>If not, please <a href="https://humaned.framer.website/">click here</a>.</p>
    </div>
</body>
</html>
